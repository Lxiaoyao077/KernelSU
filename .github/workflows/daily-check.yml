name: Daily sync & check

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/tiann/KernelSU.git
          git fetch upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "up to date with upstream ($BEHIND new commits)"
            exit 0
          fi
          echo "merging $BEHIND upstream commit(s)"
          if git merge --no-edit upstream/main; then
            git push origin main
            echo "synced upstream -> fork main"
          else
            git merge --abort
            gh issue create --title "上游同步冲突 (daily sync)" \
              --body "自动同步 tiann/KernelSU main 时发生合并冲突，需要手动处理。执行: git fetch upstream && git merge upstream/main。fork 的独有改动（miuix 移除、隐藏 Bootloader）可能与上游修改冲突。"
            echo "merge conflict, issue created"
          fi

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4

      - name: Build manager (debug)
        run: |
          cd manager
          ./gradlew assembleDebug --no-daemon

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
